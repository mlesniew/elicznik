[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elicznik"
version = "3.0.0"
description = "Tauron eLicznik hourly energy readings: Python client and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Leśniewski", email = "mlesniew@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "tzdata; sys_platform == 'win32'"]
keywords = ["elicznik", "tauron", "energy", "scraper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mlesniew/elicznik"

[project.scripts]
elicznik = "elicznik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
